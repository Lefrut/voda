plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'androidx.navigation.safeargs.kotlin'
    id 'kotlin-parcelize'
    id 'com.google.dagger.hilt.android'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'com.google.devtools.ksp'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.vodovoz.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.vodovoz.app"
        minSdk 21
        targetSdk 34
        versionCode 165
        versionName "2.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file('/home/VODOVOZ/rk_sotin/Projects/VodovozJava/VodovozVersion1.jks')
            keyAlias 'zinou'
            storePassword 'zinou123'
            keyPassword 'zinou123'
        }
    }

    buildTypes {
        release {
            //todo - debuggable false
            debuggable true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }

        debug {
            minifyEnabled false
            debuggable true
        }
    }
    lintOptions {
        checkReleaseBuilds false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17

        coreLibraryDesugaringEnabled true
    }
    kotlinOptions {
        jvmTarget = '17'

        //todo - remove before release
        freeCompilerArgs += [
                "-P", "plugin:androidx.compose.compiler.plugins.kotlin:metricsDestination=$rootDir/composeMetrics",
                "-P", "plugin:androidx.compose.compiler.plugins.kotlin:reportsDestination=$rootDir/composeReports"
        ]
    }
    buildFeatures {
        viewBinding true
        compose true
    }

    composeCompiler {
        stabilityConfigurationFile = rootProject.layout.projectDirectory.file('stability_config.conf')
    }

}

